[project]
name = "orcaslicer-plugin-prusa"
version = "0.2.0"
description = "OrcaSlicer plugin for Prusa Buddy printers (PrusaLink and Prusa Connect)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
# The plugin runs on OrcaSlicer's embedded Python with the standard library only: no runtime dependencies.
dependencies = []
# OrcaSlicer imports this module from the wheel (METADATA Import-Name); it holds the @orca.plugin class.
import-names = ["prusa_plugin"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["prusa_plugin.py", "prusa_orca"]

[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "import-linter>=2.3",
    "pytest>=8.3",
    "ruff>=0.11",
]
# Only for the scripts in tools/ that drive OrcaSlicer or generate art.
tools = ["httpx>=0.28", "openai>=1.70", "pillow>=11.1"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # the formatter handles length; long strings and HTML stay readable on one line
]

[tool.ruff.lint.per-file-ignores]
# Test and tool scripts add the repo root to sys.path before importing the package.
"tests/*" = ["E402"]
"tools/*" = ["E402"]
"prusa_plugin.py" = ["E402"]
# Page text uses real typography: minus signs on the jog buttons (X−) and an en dash for "no value".
"prusa_orca/ui/page_html.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["prusa_orca"]

[tool.basedpyright]
pythonVersion = "3.12"
include = ["prusa_orca", "prusa_plugin.py", "tests"]
exclude = ["tests/fixtures", "**/__pycache__"]
typeCheckingMode = "standard"
reportMissingModuleSource = false
# The core and backends hold the logic, so they get the strict rules.
strict = ["prusa_orca/*.py", "prusa_orca/backends"]

[tool.importlinter]
root_packages = ["prusa_orca"]

[[tool.importlinter.contracts]]
name = "Layers: app over ui and backends over the core"
type = "layers"
layers = [
    "prusa_orca.app",
    "prusa_orca.ui | prusa_orca.backends",
]
containers = []
exhaustive = false

[[tool.importlinter.contracts]]
name = "The core does not depend on the outer layers"
type = "forbidden"
source_modules = [
    "prusa_orca.consistency", "prusa_orca.control", "prusa_orca.dialect", "prusa_orca.filament_sync",
    "prusa_orca.gcode_meta", "prusa_orca.history", "prusa_orca.materials", "prusa_orca.model", "prusa_orca.phase",
    "prusa_orca.preflight", "prusa_orca.preset_sync", "prusa_orca.printers", "prusa_orca.settings",
    "prusa_orca.setup_wizard", "prusa_orca.tasks",
]
forbidden_modules = ["prusa_orca.app", "prusa_orca.ui", "prusa_orca.backends"]
